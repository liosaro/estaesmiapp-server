services:
  - type: web
    name: estaesmiapp-server
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGIN
        value: "*"
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_SHOW_ID
        sync: false
      - key: SPOTIFY_PLAYLIST_PRINCIPAL_ID
        sync: false
      - key: SPOTIFY_PLAYLIST_SPONSOR_ID
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        sync: false
      - key: RADIO_STREAM_URL
        sync: false
      - key: RADIO_STATUS_URL
        sync: false
      - key: LIVE_EMBED_URL
        sync: false
      - key: LIVE_CHAT_EMBED_URL
        sync: false
